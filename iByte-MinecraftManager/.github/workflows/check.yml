name: Preview checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record runner PHP and check source
        run: |
          php --version
          php scripts/lint.php
          php scripts/test.php
      - name: Build and inspect preview candidate
        run: |
          php scripts/package.php --candidate
          php scripts/scan.php
      # Native Panel/Livewire, browser and node acceptance are separate explicit
      # suites. This workflow never claims those ran without their fixtures.
