global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: pelican_ibyte
    scheme: https
    metrics_path: /ibyte-prometheus-exporter/metrics
    scrape_interval: 5s
    scrape_timeout: 4s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/pelican_scrape_token
    static_configs:
      - targets: ['panel.example.com:443']
