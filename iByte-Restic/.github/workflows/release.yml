name: Publish tested release
on:
  push:
    tags: ['v3.0.0']
permissions:
  contents: read
jobs:
  validation:
    uses: ./.github/workflows/test.yml
  publish:
    needs: validation
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: .
      - run: bash scripts/validate-release.sh
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title 'iByte Restic v3.0.0' --notes-file docs/RELEASE_NOTES.md .build/release-artifacts/ibyte-restic-install-v3.0.0.zip .build/release-artifacts/ibyte-restic-wings-v3.0.0.zip .build/release-artifacts/ibyte-restic-pelican-v3.0.0-source.zip .build/release-artifacts/SHA256SUMS .build/release-artifacts/NODE-SHA256SUMS .build/release-artifacts/install-wings-restic.sh .build/release-artifacts/ibyte-pelican-wings-restic-*-linux-* .build/release-artifacts/ibyte-node-tool-*-linux-* .build/release-artifacts/restic-0.19.1-linux-* "release/Wings Installer/install.sh" "release/Panel Plugin/ibyte-restic-v2.0.0.zip"
